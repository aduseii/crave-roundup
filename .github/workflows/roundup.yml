name: Roundup

on:
  schedule:
    # every run is "auto": it makes the morning roundup (from 6:30am GMT) or the evening roundup
    # (from 5:30pm GMT) if that one is still missing today, otherwise it does a breaking check.
    # GitHub sometimes runs these late or skips them, so whichever run happens fills the gap.
    - cron: "47 6 * * *"
    - cron: "47 17 * * *"
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run"
        required: true
        default: auto
        type: choice
        options: [auto, morning, evening, breaking]

permissions:
  contents: write

concurrency:
  group: roundup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"
          else MODE=auto
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Check which secrets are set (yes/no only, never the values)
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          S_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN != '' }}
          S_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          S_TELEGRAM: ${{ secrets.TELEGRAM != '' }}
          S_TELEGRAMBOT: ${{ secrets.TELEGRAMBOT != '' }}
          S_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY != '' }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          V_TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN != '' }}
          V_TMDB_API_KEY: ${{ vars.TMDB_API_KEY != '' }}
        run: env | grep -E '^(S|V)_' | sort

      - name: Run the roundup
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAMBOT || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN || secrets.TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
        run: python roundup.py "${{ steps.mode.outputs.mode }}"

      - name: Save pages and data
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "roundup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git commit -m "$(cat "$RUNNER_TEMP/roundup_mode" 2>/dev/null || echo $MODE) roundup $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
